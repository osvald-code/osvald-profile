
<mat-drawer-container class="drawer-container" autosize>
  <mat-drawer #drawer class="drawer-sidenav" mode="side">
    @for(viewItem of viewData; track viewItem.view ){
      <button class="nav-item" (click)="selectView(viewItem.view)">
        <h2>>_:pilot_apps/{{viewItem.name}}</h2>
      </button>
    }
  </mat-drawer>

  <div class="sidenav-content">
    <button class="sidenav-close" (click)="showDrawer()">
      @if(showNav()){
        <h1><</h1>
      }@else{
        <h1>></h1>
      }

    </button>
  </div>
</mat-drawer-container>
@switch(selectedView()){
  @case(VIEW.Hexgrid){
      <app-hex-grid/>
  }
  @case(VIEW.Character){
    <app-player-sheet></app-player-sheet>
  }
}
